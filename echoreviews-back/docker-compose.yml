services:
  echoreviews-api:
    build: .
    image: echoreviews-api
    container_name: echoreviews-api-container
    # .env es opcional: los valores de abajo ya bastan para desarrollo local,
    # así que un `git clone` + `docker compose up` funciona sin pasos previos.
    # Antes esto era `- .env` a secas y Compose fallaba al arrancar si el
    # archivo no existía (y .env está en .gitignore, así que nunca existía
    # en un clon nuevo).
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: echoreviews_db
      DB_USER: echoreviews_user
      DB_PASSWORD: echoreviews_password
    dns:
      - 8.8.8.8
      - 1.1.1.1

  mysql:
    image: mysql:8.4
    container_name: echoreviews-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: echoreviews_db
      MYSQL_USER: echoreviews_user
      MYSQL_PASSWORD: echoreviews_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - echoreviews_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  echoreviews_mysql_data:
