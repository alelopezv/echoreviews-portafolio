server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las portadas viajan en el cuerpo de la petición al crear una reseña, y
    # el límite por defecto de nginx es 1 MB. Sin esta línea, subir una imagen
    # normal falla con un 413 que no dice gran cosa.
    client_max_body_size 10M;

    # ── El backend ──────────────────────────────────────────────────────────
    #
    # "back" es el nombre del servicio en docker-compose.yml: Docker lo
    # resuelve dentro de la red. Funciona porque este contenedor y el del
    # backend comparten la red `frontend`.
    #
    # Ojo con la barra final: `proxy_pass http://back:8000;` SIN barra
    # conserva la ruta completa, así que /api/reviews/ llega a Django como
    # /api/reviews/. Con barra (`http://back:8000/`) nginx recortaría el
    # prefijo y Django recibiría /reviews/, que no existe.
    location /api/ {
        proxy_pass http://back:8000;
        include /etc/nginx/proxy_params_echoreviews;
    }

    # El admin de Django y sus archivos estáticos, para que se llegue a
    # localhost/admin/ sin exponer el puerto del backend.
    location /admin/ {
        proxy_pass http://back:8000;
        include /etc/nginx/proxy_params_echoreviews;
    }

    location /static/ {
        proxy_pass http://back:8000;
        include /etc/nginx/proxy_params_echoreviews;
    }

    # Las portadas de las obras. Fíjate en el "media" DOS VECES: no es un
    # error, es donde viven de verdad. MEDIA_URL es "/media/" y el modelo
    # guarda con upload_to="media/", así que una portada queda en
    # /media/media/kaiba.jpg.
    #
    # Y es crucial que el bloque sea tan específico. Con `location /media/`
    # a secas, nginx se tragaría también /media/3 — que NO es una imagen,
    # es la ruta de React Router para la ficha de una obra. El sitio
    # funcionaría navegando desde el catálogo y daría 404 al recargar esa
    # misma página, porque recién ahí la petición llega hasta nginx.
    location /media/media/ {
        proxy_pass http://back:8000;
        include /etc/nginx/proxy_params_echoreviews;
    }

    # ── El frontend ─────────────────────────────────────────────────────────
    #
    # try_files es imprescindible en una SPA. Las rutas como /review/5 las
    # resuelve React Router EN EL NAVEGADOR: en el disco no existe ningún
    # archivo con ese nombre. Sin esta línea, entrar directo a esa dirección
    # o recargar la página daría un 404 de nginx, aunque navegando desde la
    # portada funcionara.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
